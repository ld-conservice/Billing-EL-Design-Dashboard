<body>

<header>
  <div>
    <h1>Billing EL Program Dashboard</h1>
    <div class="subtitle">Days 3–10 · Conservice Billing Entry Level</div>
  </div>
  <div class="header-controls">
    <button class="btn primary editor-only" onclick="openAddModal()">+ Add Content</button>
    <button class="btn ghost editor-only" onclick="exportJSON()">Export</button>
    <button class="btn ghost" onclick="window.print()">Print</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="overview" onclick="showView('overview')">Overview</button>
  <button class="tab" data-view="tracker" onclick="showView('tracker')">🧭 Training Program Roadmap</button>
  <button class="tab" data-view="day" onclick="showView('day')">Detailed by Day</button>
  <button class="tab" data-view="all" onclick="showView('all')">All Content</button>
</nav>

<main>
  <!-- OVERVIEW -->
  <div id="view-overview" class="view active">
    <div class="kpi-row" id="kpiRow"></div>
    <div id="dayGrid"></div>
  </div>

  <!-- TRACKER -->
  <div id="view-tracker" class="view">
    <div id="trackerContent"></div>
  </div>

  <!-- WEEK -->
  <div id="view-week" class="view">
    <div id="weekContent"></div>
  </div>

  <!-- DAY -->
  <div id="view-day" class="view">
    <div class="day-header">
      <h2>Day View</h2>
      <select id="daySelect" class="day-select" onchange="renderDay()">
        <option value="3">Day 3</option>
        <option value="4">Day 4</option>
        <option value="5">Day 5</option>
        <option value="6">Day 6</option>
        <option value="7">Day 7</option>
        <option value="8">Day 8</option>
        <option value="9">Day 9</option>
        <option value="10">Day 10</option>
      </select>
    </div>
    <div id="dayContent"></div>
  </div>

  <!-- ALL CONTENT -->
  <div id="view-all" class="view">
    <div class="section-eyebrow">Master List</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
      <div class="section-title" style="margin-bottom:0;">All Content <span style="font-weight:400;color:var(--gray-body);font-size:14px;" id="allCountLabel"></span></div>
      <button class="btn solid editor-only" onclick="openAddModal()">+ Add Content</button>
    </div>
    <div class="all-content-controls">
      <input type="text" id="filterInput" class="filter-input" placeholder="Filter by title, day, content type, or system..." oninput="renderAll()">
      <select id="filterDay" class="day-select" onchange="renderAll()">
        <option value="">All Days</option>
        <option value="3">Day 3</option>
        <option value="4">Day 4</option>
        <option value="5">Day 5</option>
        <option value="6">Day 6</option>
        <option value="7">Day 7</option>
        <option value="8">Day 8</option>
        <option value="9">Day 9</option>
        <option value="10">Day 10</option>
      </select>
      <select id="filterStage" class="day-select" onchange="renderAll()">
        <option value="">All Stages</option>
        <option value="collect">01 · Collect Data</option>
        <option value="prep">02 · Prep Work</option>
        <option value="calc">03 · Calculate Charges</option>
        <option value="quality">04 · Quality Check</option>
        <option value="bill">05 · Bill Residents</option>
        <option value="recovery">06 · Recovery</option>
        <option value="comms">Customer Comms</option>
        <option value="__none__">— None / Foundational</option>
      </select>
    </div>
    <div id="allContent" class="all-content-list"></div>
  </div>

</main>

<!-- ADD/EDIT MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Add Content</h2>
    <div class="modal-sub" id="modalSub">Add a new module to the program.</div>
    <div class="form-grid">
      <div class="form-field full">
        <label>Module / Session Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Bill Dates — The Expert Check">
      </div>
      <div class="form-field">
        <label>Day *</label>
        <select id="f-day">
          <option value="3">Day 3</option>
          <option value="4">Day 4</option>
          <option value="5">Day 5</option>
          <option value="6">Day 6</option>
          <option value="7">Day 7</option>
          <option value="8">Day 8</option>
          <option value="9">Day 9</option>
          <option value="10">Day 10</option>
        </select>
      </div>
      <div class="form-field">
        <label>Estimated Minutes</label>
        <input type="number" id="f-mins" min="0" step="5" value="30">
      </div>
      <div class="form-field">
        <label>Content Type</label>
        <select id="f-ct">
          <option value="Undetermined" selected>Undetermined</option>
          <option value="ILT">ILT</option>
          <option value="Blended">Blended</option>
          <option value="eLearning">eLearning</option>
          <option value="Simulation">Simulation</option>
          <option value="Activity">Activity</option>
          <option value="OTJ">OTJ</option>
          <option value="Assessment">Assessment</option>
          <option value="Video">Video</option>
        </select>
      </div>
      <div class="form-field">
        <label>Lifecycle Stage</label>
        <select id="f-stage">
          <option value="">— None / Foundational —</option>
          <option value="collect">01 · Collect Data</option>
          <option value="prep">02 · Prep Work</option>
          <option value="calc">03 · Calculate Charges</option>
          <option value="quality">04 · Quality Check</option>
          <option value="bill">05 · Bill Residents</option>
          <option value="recovery">06 · Recovery</option>
          <option value="comms">Customer Communication (cross-cutting)</option>
        </select>
      </div>
      <div class="form-field">
        <label>Status</label>
        <select id="f-status">
          <option value="ns">Not Started</option>
          <option value="ip">In Development</option>
          <option value="rv">In Review</option>
          <option value="r1">Revisions 1</option>
          <option value="r2">Revisions 2</option>
          <option value="r3">Revisions 3</option>
          <option value="fr">Final Review</option>
          <option value="cp">Complete</option>
          <option value="oh">On Hold</option>
          <option value="cn">Cancelled</option>
        </select>
      </div>
      <div class="form-field">
        <label>Design Start</label>
        <input type="date" id="f-dstart">
      </div>
      <div class="form-field">
        <label>Design End (anticipated)</label>
        <input type="date" id="f-dend">
      </div>
      <div class="form-field">
        <label>Review Close (override)</label>
        <input type="date" id="f-revclose">
        <div class="form-help" style="font-size:10.5px;color:var(--navy-mid);margin-top:3px;">Auto-computed as Design End + 3 business days. Set here to override.</div>
      </div>
      <div class="form-field full">
        <label>Google Drive Link (optional)</label>
        <input type="url" id="f-link" placeholder="https://drive.google.com/...">
      </div>
      <div class="form-field full">
        <label>Learner Outcome</label>
        <textarea id="f-outcome" placeholder="What the learner will be able to do..."></textarea>
      </div>
      <div class="form-field full">
        <label>Decisions the Learner Must Make</label>
        <textarea id="f-decisions"></textarea>
      </div>
      <div class="form-field">
        <label>Systems / Tools</label>
        <input type="text" id="f-systems" placeholder="e.g. YODA, Skywalker">
      </div>
      <div class="form-field">
        <label>Artifact 1</label>
        <input type="text" id="f-a1" placeholder="e.g. Facilitator Guide">
      </div>
      <div class="form-field">
        <label>Artifact 2</label>
        <input type="text" id="f-a2">
      </div>
      <div class="form-field">
        <label>Artifact 3</label>
        <input type="text" id="f-a3">
      </div>
      <div class="form-field full">
        <label>Notes (static reference)</label>
        <textarea id="f-notes"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="modalDeleteBtn" onclick="deleteModule()" style="display:none;">Delete</button>
      <div style="flex:1;"></div>
      <div class="modal-actions-right">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn solid" onclick="saveModule()" id="modalSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

const STAGE_INFERENCE = [
  { re: /submeter|meter concept|meter estim|meter read|reading|abp|import|initial read|prop cons|v3 report/i, s: 'prep' },
  { re: /provider bill|prep|fusion|data entry|holding spread|distinguish/i, s: 'prep' },
  { re: /bill date|billing method|billing math|utility amount|\bua\b|rate|calc|calculation|ramping|rent-only|methodolog|fee screen|mimo|stats|billing process/i, s: 'calc' },
  { re: /qc|quality|handback|documentation|note standard|good note|bad note|good documentation/i, s: 'quality' },
  { re: /prebill|utility message|export|bill residents|customer service fundamental|csr/i, s: 'bill' },
  { re: /recovery|u exception/i, s: 'recovery' },
  { re: /exception|exception note/i, s: 'quality' },
  { re: /report|reports/i, s: 'quality' },
  { re: /client comm|client email|professional email|mock email|bob tenet|grading rubric/i, s: 'comms' },
];

function stableId(m) {
  const key = `d${m.d}-${(m.n||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,40)}`;
  return key;
}
function newId() {
  return 'u-' + Math.random().toString(36).slice(2, 10);
}

function loadOverlays() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      overlays = Object.assign({added:[],edits:{},deleted:[],order:{},comments:{},agenda:{}}, parsed);
    }
  } catch(e) {
    console.warn('overlay load failed', e);
  }
}
function saveOverlays() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(overlays));
  } catch(e) {
    console.warn('overlay save failed', e);
  }
}

function rebuildModules() {
  const withIds = SCAFFOLD.map(m => ({...m, id: stableId(m), _base: true}));
  const kept = withIds.filter(m => !overlays.deleted.includes(m.id));
  const merged = kept.map(m => {
    const e = overlays.edits[m.id];
    return e ? {...m, ...e, id: m.id, _base: true} : m;
  });
  const added = (overlays.added || []).map(m => ({...m, _base: false}));
  baseModules = [...merged, ...added];
  modules = baseModules;
}

function orderedForDay(day) {
  const list = modules.filter(m => m.d === day);
  const orderIds = overlays.order[day];
  if (!orderIds || !orderIds.length) return list;
  const byId = new Map(list.map(m => [m.id, m]));
  const ordered = [];
  orderIds.forEach(id => { if (byId.has(id)) { ordered.push(byId.get(id)); byId.delete(id); } });
  byId.forEach(m => ordered.push(m));
  return ordered;
}

function orderedAll() {
  const days = [3,4,5,6,7,8,9,10];
  return days.flatMap(d => orderedForDay(d));
}

function showView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelector(`.tab[data-view="${v}"]`).classList.add('active');
  if (v === 'overview') renderOverview();
  if (v === 'tracker') renderTracker();
  if (v === 'week') renderWeek();
  if (v === 'day') renderDay();
  if (v === 'all') renderAll();
}

// ===== STATUS =====
function getStatus(m) {
  if (m.st && ['ns','ip','rv','r1','r2','r3','fr','cp','oh','cn'].includes(m.st)) return m.st;
  if (m.dr === 0) return 'cp';
  if (m.dr === 1) return 'ns';
  return 'ns';
}
function statusLabel(s) {
  return {ns:'Not Started', ip:'In Development', rv:'In Review', r1:'Revisions 1', r2:'Revisions 2', r3:'Revisions 3', fr:'Final Review', cp:'Complete', oh:'On Hold', cn:'Cancelled'}[s] || s;
}
function stageKey(m) {
  if (m.stage) return m.stage;
  const hay = ((m.n||'') + ' ' + (m.nt||'')).toLowerCase();
  for (const r of STAGE_INFERENCE) if (r.re.test(hay)) return r.s;
  return '';
}
function stageClass(m) {
  const s = stageKey(m);
  return s ? 'stage-' + s : '';
}
function stageChip(m) {
  const s = stageKey(m);
  if (!s) return `<span class="stage-chip stage-none" title="No lifecycle stage">Foundational</span>`;
  const map = {
    collect: {n:'01 Collect', c:'stage-collect'},
    prep:    {n:'02 Prep',    c:'stage-prep'},
    calc:    {n:'03 Calc',    c:'stage-calc'},
    quality: {n:'04 QC',      c:'stage-quality'},
    bill:    {n:'05 Bill',    c:'stage-bill'},
    recovery:{n:'06 Recov',   c:'stage-recovery'},
    comms:   {n:'Comms',      c:'stage-comms'},
  };
  const it = map[s]; if (!it) return '';
  return `<span class="stage-chip ${it.c}" title="${it.n}">${it.n}</span>`;
}
function statusPill(m) {
  const s = getStatus(m);
  return `<span class="status-pill ${s}" title="${statusLabel(s)}"><span class="dot"></span>${statusLabel(s)}</span>`;
}
function statusPillClickable(m) {
  const s = getStatus(m);
  return `<span class="status-pill ${s} clickable" title="Click to cycle status" onclick="event.stopPropagation(); cycleStatus('${m.id}')"><span class="dot"></span>${statusLabel(s)}</span>`;
}
function cycleStatus(id) {
  // Linear flow: Not Started → In Development → In Review → Revisions 1 →
  // Revisions 2 → Revisions 3 → Final Review → Complete → (loop). oh and cn
  // rejoin the flow at In Development / Not Started respectively.
  const cycle = {ns:'ip', ip:'rv', rv:'r1', r1:'r2', r2:'r3', r3:'fr', fr:'cp', cp:'ns', oh:'ip', cn:'ns'};
  const m = modules.find(x => x.id === id);
  if (!m) return;
  const cur = getStatus(m);
  const next = cycle[cur] || 'ns';
  overlays.edits[id] = overlays.edits[id] || {};
  overlays.edits[id].st = next;
  // When flipping into any stakeholder-facing review state (rv or fr), stamp
  // today's date as "sent" so the review window auto-populates
  // (sent + 5 biz days = due). fr resets the window since it's a new review round.
  if (next === 'rv' || next === 'fr') {
    const t = new Date();
    const iso = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
    if (next === 'fr') {
      // Final Review is a fresh review window — always restamp and clear any
      // manual close-date override so the 5-business-day auto-window applies.
      overlays.edits[id].dend = iso;
      overlays.edits[id].revclose = '';
    } else {
      const merged = Object.assign({}, m, overlays.edits[id]);
      if (!merged.dend) overlays.edits[id].dend = iso;
    }
  }
  saveOverlays();
  rebuildModules();
  const activeTab = document.querySelector('.tab.active').dataset.view;
  showView(activeTab);
  showToast(`Status → ${statusLabel(next)}`);
}

function capacityClass(mins) {
  const pct = mins / DAY_BUDGET;
  if (pct > 1) return 'cap-over';
  if (pct >= 0.95) return 'cap-full';
  if (pct >= 0.75) return 'cap-hot';
  if (pct >= 0.5) return 'cap-warm';
  return 'cap-cool';
}

function dayStatus(mins) {
  if (mins > DAY_BUDGET) return {cls: 'over', text: 'Over Budget'};
  if (mins >= DAY_BUDGET * 0.9) return {cls: 'full', text: 'Nearly Full'};
  return {cls: 'under', text: 'Available'};
}
function esc(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ===== OVERVIEW =====
function renderOverview() {
  const total = modules.length;
  const totalMins = modules.reduce((s, m) => s + m.m, 0);
  const totalHours = (totalMins / 60).toFixed(1);
  const statusCounts = {ns:0, ip:0, rv:0, r1:0, r2:0, r3:0, fr:0, cp:0, oh:0, cn:0};
  modules.forEach(m => statusCounts[getStatus(m)]++);
  const cpPct = total ? Math.round((statusCounts.cp / total) * 100) : 0;
  // In-flight = anything actively being worked on or reviewed (not started/hold/cancel/done are excluded)
  const ipRv = statusCounts.ip + statusCounts.rv + statusCounts.r1 + statusCounts.r2 + statusCounts.r3 + statusCounts.fr;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi">
      <div class="kpi-label">Total Modules</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-sub">${totalHours} hours designed</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Not Started</div>
      <div class="kpi-value">${statusCounts.ns}</div>
      <div class="kpi-sub">awaiting design</div>
    </div>
    <div class="kpi ${statusCounts.cp > 0 ? 'good' : ''}">
      <div class="kpi-label">Complete</div>
      <div class="kpi-value">${statusCounts.cp}</div>
      <div class="kpi-sub">${cpPct}% of program</div>
    </div>
    <div class="kpi ${ipRv > 0 ? 'warn' : ''}">
      <div class="kpi-label">In Flight</div>
      <div class="kpi-value">${ipRv}</div>
      <div class="kpi-sub">${statusCounts.ip} dev · ${statusCounts.rv} review</div>
    </div>
  `;

  const w1 = [3,4,5].map(d => renderDayCard(d)).join('');
  const w2 = [6,7,8,9,10].map(d => renderDayCard(d)).join('');
  const w1Collapsed = localStorage.getItem('weekCollapsed_1') === '1';
  const w2Collapsed = localStorage.getItem('weekCollapsed_2') === '1';
  document.getElementById('dayGrid').innerHTML = `
    <div class="week-section week-1 ${w1Collapsed ? 'collapsed' : ''}">
      <div class="week-section-header" onclick="toggleWeekSection(1)">
        <span class="rail"></span>
        <span>Week 1 · Days 3–5</span>
        <span class="ws-caret">▾</span>
      </div>
      <div class="day-grid">${w1}</div>
    </div>
    <div class="week-section week-2 ${w2Collapsed ? 'collapsed' : ''}">
      <div class="week-section-header" onclick="toggleWeekSection(2)">
        <span class="rail"></span>
        <span>Week 2 · Days 6–10</span>
        <span class="ws-caret">▾</span>
      </div>
      <div class="day-grid">${w2}</div>
    </div>
  `;
}

function toggleWeekSection(weekNum) {
  const section = document.querySelector(`.week-section.week-${weekNum}`);
  if (!section) return;
  section.classList.toggle('collapsed');
  const isCollapsed = section.classList.contains('collapsed');
  localStorage.setItem(`weekCollapsed_${weekNum}`, isCollapsed ? '1' : '0');
}

function renderDayCard(day) {
  const dayMods = modules.filter(m => m.d === day);
  const mins = dayMods.reduce((s, m) => s + m.m, 0);
  const pct = Math.min((mins / DAY_BUDGET) * 100, 100);
  const ds = dayStatus(mins);
  const capCls = capacityClass(mins);
  const week = day <= 5 ? 1 : 2;
  const counts = {ns:0, ip:0, rv:0, r1:0, r2:0, r3:0, fr:0, cp:0, oh:0, cn:0};
  dayMods.forEach(m => counts[getStatus(m)]++);
  const totalCount = dayMods.length;
  const cpCount = counts.cp;
  const cpPct = totalCount ? Math.round((cpCount / totalCount) * 100) : 0;
  const pipsHtml = dayMods.slice(0, 12).map(m => {
    const s = getStatus(m);
    return `<span class="day-card-completion-pip ${s}" title="${esc(m.n)} — ${statusLabel(s)}"></span>`;
  }).join('');
  const overflow = dayMods.length > 12 ? `<span style="font-size:9px;color:var(--gray-body);margin-left:2px;">+${dayMods.length-12}</span>` : '';
  const capIcon = mins >= DAY_BUDGET * 0.95 && mins <= DAY_BUDGET
    ? '<span class="cap-icon" title="Nearly full">✓</span>'
    : (mins > DAY_BUDGET ? '<span class="cap-icon over" title="Over budget">!</span>' : '');
  return `
    <div class="day-card week-${week}" onclick="goToDay(${day})">
      <div class="day-card-header">
        <div><h3>Day ${day}${capIcon}</h3><span class="week-badge">Week ${week}</span></div>
        <span class="day-status ${ds.cls}">${ds.text}</span>
      </div>
      <div class="day-card-bar"><div class="day-card-bar-fill ${capCls}" style="width: ${pct}%"></div></div>
      <div class="day-card-meta">
        <span><strong>${dayMods.length}</strong> modules</span>
        <span><strong>${mins}</strong>m / ${DAY_BUDGET}m</span>
      </div>
      <div class="day-completion-row">
        <span class="label">Progress:</span>
        ${pipsHtml}${overflow}
        <span class="pct">${cpPct}%</span>
      </div>
    </div>
  `;
}

function renderWeek() {
  const html = [];
  const w1 = [3,4,5];
  const w2 = [6,7,8,9,10];
  const buildCard = (day) => {
    const dayMods = modules.filter(m => m.d === day);
    const mins = dayMods.reduce((s,m) => s + m.m, 0);
    const capCls = capacityClass(mins);
    const week = day <= 5 ? 1 : 2;
    return `
      <div class="day-card week-${week}" onclick="goToDay(${day})">
        <div class="day-card-header"><h3>Day ${day}</h3></div>
        <div class="day-card-bar"><div class="day-card-bar-fill ${capCls}" style="width:${Math.min((mins/DAY_BUDGET)*100,100)}%"></div></div>
        <div class="day-card-meta"><span><strong>${dayMods.length}</strong> modules</span><span><strong>${mins}</strong>m</span></div>
      </div>`;
  };
  html.push(`<div class="week-card"><h2 data-week="Week 1">Week 1 <span class="week-sub">· Days 3–5 · Fundamentals</span></h2><div class="week-days">${w1.map(buildCard).join('')}</div></div>`);
  html.push(`<div class="week-card week-2"><h2 data-week="Week 2">Week 2 <span class="week-sub">· Days 6–10 · Meters, Methods, Skills</span></h2><div class="week-days">${w2.map(buildCard).join('')}</div></div>`);
  document.getElementById('weekContent').innerHTML = html.join('');
}

function goToDay(day) {
  document.getElementById('daySelect').value = day;
  showView('day');
}
function goToModule(id, day) {
  document.getElementById('daySelect').value = day;
  showView('day');
  setTimeout(() => {
    const el = document.querySelector(`.module-card[data-id="${id}"]`);
    if (!el) return;
    el.scrollIntoView({behavior: 'smooth', block: 'center'});
    el.style.transition = 'box-shadow 0.5s ease';
    const prev = el.style.boxShadow;
    el.style.boxShadow = '0 0 0 3px rgba(240,180,41,0.65), 0 12px 40px rgba(240,180,41,0.35)';
    setTimeout(() => { el.style.boxShadow = prev; }, 2000);
  }, 120);
}

// ===== ROUTE (TRACKER) =====
let routeOpenDays = new Set();

function toggleRouteDay(day) {
  if (routeOpenDays.has(day)) routeOpenDays.delete(day);
  else routeOpenDays.add(day);
  renderTracker();
}

function markReviewComplete(id) {
  const m = modules.find(x => x.id === id);
  if (!m) return;
  overlays.edits[id] = overlays.edits[id] || {};
  overlays.edits[id].st = 'cp';
  saveOverlays();
  rebuildModules();
  const activeTab = document.querySelector('.tab.active').dataset.view;
  showView(activeTab);
  showToast(`✔ ${m.n.slice(0, 40)}${m.n.length > 40 ? '…' : ''} → Complete`);
}

function renderTracker() {
  const days = [3,4,5,6,7,8,9,10];
  const perDay = days.map(d => {
    const dayMods = modules.filter(m => m.d === d);
    const total = dayMods.length || 1;
    const counts = {ns:0, ip:0, rv:0, r1:0, r2:0, r3:0, fr:0, cp:0, oh:0, cn:0};
    dayMods.forEach(m => counts[getStatus(m)]++);
    const inFlight = counts.ip + counts.rv + counts.r1 + counts.r2 + counts.r3 + counts.fr;
    const cpPct = (counts.cp / total) * 100;
    const ipRvPct = (inFlight / total) * 100;
    let cls = 'pending', pill = 'pending', pillLabel = 'Not Started';
    if (counts.cp === total) { cls = 'done'; pill = 'done'; pillLabel = 'Complete'; }
    else if (counts.cp + inFlight > 0) { cls = 'active'; pill = 'active'; pillLabel = 'In Progress'; }
    return {d, total, counts, cpPct, ipRvPct, cls, pill, pillLabel};
  });

  const totalMods = modules.length;
  const overallCounts = {ns:0, ip:0, rv:0, r1:0, r2:0, r3:0, fr:0, cp:0, oh:0, cn:0};
  modules.forEach(m => overallCounts[getStatus(m)]++);
  const overallInFlight = overallCounts.ip + overallCounts.rv + overallCounts.r1 + overallCounts.r2 + overallCounts.r3 + overallCounts.fr;
  const overallCpPct = totalMods ? (overallCounts.cp / totalMods) * 100 : 0;
  const overallIpRvPct = totalMods ? (overallInFlight / totalMods) * 100 : 0;
  const overallProgressPct = Math.round(overallCpPct + overallIpRvPct);
  const overallCpRounded = Math.round(overallCpPct);

  const stagesDef = [
    {num: '01', label: 'Analyze',   sub: 'Needs, learners, constraints'},
    {num: '02', label: 'Design',    sub: 'Objectives, structure, blueprint'},
    {num: '03', label: 'Develop',   sub: 'Materials built & reviewed'},
    {num: '04', label: 'Implement', sub: 'Delivered to facilitators'},
    {num: '05', label: 'Evaluate',  sub: 'Outcomes measured, iterated'}
  ];

  // Analyze is complete (foundational research done). Design is active until
  // most modules are complete. Develop takes over once bulk of content ships.
  let currentStageIdx = 1; // Design
  if (overallCpPct >= 100) currentStageIdx = 4;      // Evaluate
  else if (overallCpPct >= 75) currentStageIdx = 3;  // Implement
  else if (overallCpPct >= 25) currentStageIdx = 2;  // Develop

  const stagesHtml = stagesDef.map((s, idx) => {
    let cls = '';
    let badge = '';
    if (idx < currentStageIdx) { cls = 'done'; badge = '<div class="route-stage-badge">Complete</div>'; }
    else if (idx === currentStageIdx) { cls = 'active'; badge = '<div class="route-stage-badge">In Progress</div>'; }
    return `
      <div class="route-stage ${cls}">
        ${badge}
        <div class="route-stage-num">${s.num}</div>
        <div class="route-stage-label">${s.label}</div>
        <div class="route-stage-sub">${s.sub}</div>
      </div>
    `;
  }).join('');

  const daysHtml = perDay.map(pd => {
    const isOpen = routeOpenDays.has(pd.d);
    const dayMods = modules.filter(m => m.d === pd.d);
    const caret = isOpen ? '▼' : '▶';
    const modsHtml = isOpen ? `
      <div class="route-day-mods">
        ${dayMods.map(m => {
          const st = getStatus(m);
          return `
            <div class="route-day-mod st-${st}">
              <div class="rdm-title" title="${esc(m.n)}">${esc(m.n)}</div>
              <div class="rdm-tags">
                ${stageChip(m)}
                <span class="rdm-status st-${st}">${statusLabel(st).replace(' Development','').replace('Not Started','Not Started')}</span>
                <span class="rdm-mins">${m.m}m</span>
              </div>
            </div>
          `;
        }).join('')}
        <div class="route-day-actions">
          <button class="route-day-goto" onclick="event.stopPropagation(); goToDay(${pd.d})">Open Day ${pd.d} →</button>
        </div>
      </div>
    ` : '';
    return `
      <div class="route-day ${pd.cls} ${isOpen ? 'open' : ''}">
        <div class="route-day-head" onclick="toggleRouteDay(${pd.d})">
          <h4>Day ${pd.d} <span class="rd-caret">${caret}</span></h4>
          <span class="route-day-pill ${pd.pill}">${pd.pillLabel}</span>
        </div>
        <div class="route-day-progress">
          <div class="route-day-progress-ip" style="width: ${pd.cpPct + pd.ipRvPct}%;"></div>
          <div class="route-day-progress-cp" style="width: ${pd.cpPct}%;"></div>
        </div>
        <div class="route-day-meta">
          <span>${pd.total} module${pd.total===1?'':'s'} · ${pd.counts.cp} done</span>
          <span class="pct">${Math.round(pd.cpPct)}%</span>
        </div>
        ${modsHtml}
      </div>
    `;
  }).join('');

  // ===== THE HANDOFF — modules currently with stakeholders =====
  // Includes both In Review (rv) and Final Review (fr) modules, since both
  // are actively sitting with stakeholders and need the same visibility.
  const reviewMods = modules
    .filter(m => { const s = getStatus(m); return s === 'rv' || s === 'fr'; })
    .map(m => ({m, info: reviewInfo(m)}))
    .sort((a, b) => {
      const aOver = a.info.delta !== null && a.info.delta < 0;
      const bOver = b.info.delta !== null && b.info.delta < 0;
      if (aOver !== bOver) return aOver ? -1 : 1;
      if (a.info.delta === null && b.info.delta !== null) return 1;
      if (a.info.delta !== null && b.info.delta === null) return -1;
      if (a.info.delta === null && b.info.delta === null) return a.m.d - b.m.d;
      return a.info.delta - b.info.delta;
    });

  const handoffOverdue = reviewMods.filter(x => x.info.delta !== null && x.info.delta < 0).length;
  const handoffNoDate  = reviewMods.filter(x => x.info.delta === null).length;
  const handoffActive  = reviewMods.length - handoffOverdue - handoffNoDate;

  const handoffRows = reviewMods.map(({m, info}) => {
    const isOverdue = info.delta !== null && info.delta < 0;
    const isNoDate  = info.delta === null;
    const isLocked  = info.delta === 0;
    const cls = isOverdue ? 'overdue' : (isNoDate ? 'no-date' : (isLocked ? 'locked' : ''));
    let daysBig, daysLabel, daysLabelCls = '';
    if (isNoDate) {
      daysBig = '—';
      daysLabel = 'no deadline set';
    } else if (isOverdue) {
      daysBig = Math.abs(info.delta);
      daysLabel = `day${Math.abs(info.delta) === 1 ? '' : 's'} overdue`;
      daysLabelCls = 'overdue';
    } else if (isLocked) {
      daysBig = 0;
      daysLabel = 'closes today';
    } else {
      daysBig = info.delta;
      daysLabel = `day${info.delta === 1 ? '' : 's'} left`;
    }
    const isFinal = getStatus(m) === 'fr';
    const icon = isOverdue ? '⚠' : (isNoDate ? '?' : (isLocked ? '🔒' : (isFinal ? '🚨' : '🚀')));
    let trackHtml;
    if (isNoDate) {
      trackHtml = `<div class="hr-track"><div class="hr-track-empty">No sent or due date on record</div></div>`;
    } else {
      const sentStr = info.sent ? fmtDate(info.sent) : '—';
      const dueStr  = info.due  ? fmtDate(info.due)  : '—';
      // Urgency thermometer: MORE fill = MORE urgent (consumed / used up).
      // Length scales against a 5-day SLA:
      //   5+ days left → ~10% (small green nub, "fresh")
      //   3 days left → ~40% amber
      //   1 day left  → ~80% red
      //   overdue    → 100% red pulsing
      const SLA_SCALE = 5;
      const daysRemaining = Math.max(0, info.bizTotal - info.bizFilled);
      // Consumed = SLA - remaining, clamped 0..SLA
      const consumed = Math.max(0, Math.min(SLA_SCALE, SLA_SCALE - daysRemaining));
      const pctRaw = (consumed / SLA_SCALE) * 100;
      const barPct = Math.max(8, Math.min(100, pctRaw)); // 8% floor keeps a nub visible when fresh
      let fillClass;
      if (isOverdue)               fillClass = 'overdue';
      else if (daysRemaining <= 1) fillClass = 'critical';
      else if (daysRemaining <= 3) fillClass = 'warning';
      else                         fillClass = 'healthy';
      const barTip = isOverdue
        ? `${info.bizOverdue} business day${info.bizOverdue === 1 ? '' : 's'} past due`
        : `${daysRemaining} of ${info.bizTotal} business day${info.bizTotal === 1 ? '' : 's'} remaining`;
      const overshootChip = isOverdue && info.bizOverdue > 0
        ? `<span class="hr-overshoot">+${info.bizOverdue}d</span>`
        : '';
      trackHtml = `
        <div class="hr-track">
          <div class="hr-track-dates">
            <span>Sent <strong>${esc(sentStr)}</strong></span>
            <span>${isOverdue ? 'Was due' : 'Due'} <strong>${esc(dueStr)}</strong>${overshootChip}</span>
          </div>
          <div class="hr-bar" title="${barTip}">
            <div class="hr-bar-fill ${fillClass}" style="width: ${barPct}%;"></div>
          </div>
        </div>
      `;
    }
    const finalTag = isFinal ? '<span class="hr-final-tag">FINAL · LAST CHANCE</span>' : '';
    return `
      <div class="handoff-row ${cls} ${isFinal ? 'final' : ''}" onclick="goToModule('${m.id}', ${m.d})" title="Jump to ${esc(m.n)}">
        <div class="hr-icon">${icon}</div>
        <div class="hr-main">
          <div class="hr-day-badge">Day ${m.d}</div>
          <div class="hr-title">${esc(m.n)}${finalTag}</div>
          <div class="hr-meta">${stageChip(m)}</div>
        </div>
        ${trackHtml}
        <div class="hr-status">
          <div class="hr-days">${daysBig}</div>
          <div class="hr-days-label ${daysLabelCls}">${daysLabel}</div>
        </div>
      </div>
    `;
  }).join('');

  const handoffEmpty = `
    <div class="handoff-empty">
      <div class="handoff-empty-title">🚀 Nothing with stakeholders right now</div>
      <div class="handoff-empty-sub">When a module moves to <strong>In Review</strong> or <strong>Final Review</strong>, it lands here so you can see the review window at a glance and follow up before dates slip.</div>
    </div>
  `;

  const countsHtml = [
    handoffOverdue > 0 ? `<span class="handoff-count overdue">${handoffOverdue} overdue</span>` : '',
    `<span class="handoff-count active">${handoffActive} open</span>`,
    handoffNoDate > 0 ? `<span class="handoff-count no-date">${handoffNoDate} no date</span>` : ''
  ].join('');

  document.getElementById('trackerContent').innerHTML = `
    <div class="section-eyebrow">Program Health</div>
    <div class="section-title">Delivery Route</div>
    <div class="route-wrap">
      <div class="route-header">
        <div class="route-compass">🧭</div>
        <div class="route-header-text">
          <div class="route-eyebrow">Program Lifecycle</div>
          <div class="route-title">Building Toward Launch</div>
          <div class="route-sub">Every module travels the same route from draft to delivered.</div>
        </div>
      </div>
      <div class="route-metrics">
        <div class="route-metric">
          <div class="route-metric-label">Total Modules</div>
          <div class="route-metric-value">${totalMods}</div>
          <div class="route-metric-sub">across 8 training days</div>
        </div>
        <div class="route-metric">
          <div class="route-metric-label">Complete</div>
          <div class="route-metric-value cp">${overallCounts.cp}</div>
          <div class="route-metric-sub">${overallCpRounded}% delivered</div>
        </div>
        <div class="route-metric">
          <div class="route-metric-label">In Flight</div>
          <div class="route-metric-value ip">${overallInFlight}</div>
          <div class="route-metric-sub">${overallCounts.ip} dev · ${overallCounts.rv} review · ${overallCounts.r1 + overallCounts.r2 + overallCounts.r3} revising · ${overallCounts.fr} final</div>
        </div>
        <div class="route-metric">
          <div class="route-metric-label">Not Started</div>
          <div class="route-metric-value ns">${overallCounts.ns}</div>
          <div class="route-metric-sub">awaiting design</div>
        </div>
      </div>
      <div class="route-stages-wrap">
        <div class="route-stages-heading">Stages of the Journey</div>
        <div class="route-stages">${stagesHtml}</div>
      </div>
      <div class="route-progress-wrap">
        <div class="route-progress-label">
          <span>Overall Route Progress</span>
          <span class="big">${overallProgressPct}%</span>
        </div>
        <div class="route-progress-track">
          <div class="route-progress-fill-ip" style="width: ${overallCpPct + overallIpRvPct}%"></div>
          <div class="route-progress-fill-cp" style="width: ${overallCpPct}%"></div>
        </div>
        <div class="route-progress-legend">
          <div class="route-progress-legend-item"><span class="route-progress-legend-swatch" style="background:#77BC1F;"></span>Complete</div>
          <div class="route-progress-legend-item"><span class="route-progress-legend-swatch" style="background:rgba(33,114,183,0.65);"></span>In Progress</div>

// ===== REVIEW (dates) =====
function addBusinessDays(dateStr, biz) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d)) return null;
  let count = 0;
  while (count < biz) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) count++;
  }
  return d;
}
function fmtDate(d) {
  if (!d) return '';
  if (typeof d === 'string') d = new Date(d + 'T12:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function daysUntil(d) {
  if (!d) return null;
  const now = new Date();
  now.setHours(0,0,0,0);
  const target = new Date(d);
  target.setHours(0,0,0,0);
  return Math.round((target - now) / (24*60*60*1000));
}
function businessDaysBetween(start, end) {
  if (!start || !end) return 0;
  const s = new Date(start); s.setHours(0,0,0,0);
  const e = new Date(end); e.setHours(0,0,0,0);
  if (e <= s) return 0;
  let count = 0;
  const cur = new Date(s);
  while (cur < e) {
    cur.setDate(cur.getDate() + 1);
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) count++;
  }
  return count;
}
function reviewInfo(m) {
  let sent = m.dend ? new Date(m.dend + 'T12:00:00') : null;
  let due = null;
  if (m.revclose) due = new Date(m.revclose + 'T12:00:00');
  else if (m.dend) due = addBusinessDays(m.dend, 5);
  // Defensive fallback: any review-state module (rv or fr) with no sent date
  // still needs a review window. Treat today as sent so the bar renders.
  const st = getStatus(m);
  if (!sent && (st === 'rv' || st === 'fr')) {
    const t = new Date();
    const iso = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
    sent = new Date(iso + 'T12:00:00');
    if (!due) due = addBusinessDays(iso, 5);
  }
  const delta = due ? daysUntil(due) : null;
  const now = new Date(); now.setHours(12,0,0,0);
  const bizTotal   = sent && due ? businessDaysBetween(sent, due) : 0;
  const bizElapsed = sent && now >= sent ? businessDaysBetween(sent, now) : 0;
  const bizFilled  = Math.min(bizElapsed, bizTotal);
  const bizOverdue = Math.max(0, bizElapsed - bizTotal);
  return {sent, due, delta, bizTotal, bizFilled, bizOverdue, override: !!m.revclose};
}
function reviewBadge(m) {
  const st = getStatus(m);
  if (st === 'cp') {
    if (m.dend) return `<span class="review-badge rb-done">✓ ${fmtDate(m.dend)}</span>`;
    return '';
  }
  if (st !== 'rv' && st !== 'fr') return '';
  const info = reviewInfo(m);
  const finalTag = st === 'fr' ? 'FINAL · ' : '';
  if (!info.due) return `<span class="review-badge rb-scheduled">${finalTag}no date</span>`;
  if (info.delta === null) return '';
  if (info.delta < 0) return `<span class="review-badge rb-overdue">${finalTag}${Math.abs(info.delta)}d overdue</span>`;
  if (info.delta === 0) return `<span class="review-badge rb-locked">🔒 ${finalTag}closes today</span>`;
  if (info.delta === 1) return `<span class="review-badge rb-soon">${finalTag}due tmrw</span>`;
  if (info.delta <= 3) return `<span class="review-badge rb-soon">${finalTag}${info.delta}d left</span>`;
  return `<span class="review-badge rb-scheduled">${finalTag}${info.delta}d left</span>`;
}
function reviewCornerRibbon(m) {
  const info = reviewInfo(m);
  const isOverdue = info.delta !== null && info.delta < 0;
  const isFinal = getStatus(m) === 'fr';
  let label;
  if (isFinal) label = isOverdue ? 'FINAL REVIEW · OVERDUE' : 'FINAL REVIEW · LAST CHANCE';
  else         label = isOverdue ? 'REVIEW OVERDUE' : 'IN REVIEW';
  return `<div class="review-corner-ribbon ${isOverdue ? 'overdue' : ''} ${isFinal ? 'final' : ''}">${label}</div>`;
}
function reviewLiveBanner(m) {
  const info = reviewInfo(m);
  const isOverdue = info.delta !== null && info.delta < 0;
  const isLocked  = info.delta === 0;
  const day = info.due ? info.due.getDate() : '?';
  const month = info.due ? info.due.toLocaleDateString('en-US', {month: 'short'}) : '';
  const dow = info.due ? info.due.toLocaleDateString('en-US', {weekday: 'short'}) : '';
  const chipText = info.delta === null ? 'NO DATE' : (isOverdue ? `${Math.abs(info.delta)}D LATE` : (isLocked ? 'LOCKED' : `${info.delta}D LEFT`));
  const calCls = info.delta === null ? 'no-date active' : (isOverdue ? 'overdue' : (isLocked ? 'locked' : 'active'));
  const cdCls  = isOverdue ? 'overdue' : (isLocked ? 'locked' : '');
  const headline = info.delta === null ? 'AWAITING REVIEW' : (isOverdue ? 'REVIEW WINDOW CLOSED' : (isLocked ? 'REVIEW WINDOW CLOSES TODAY' : 'REVIEW IN PROGRESS'));
  const detail = info.delta === null
    ? 'This module is with stakeholders but no due date has been set.'
    : (isOverdue
        ? `Was due <strong>${fmtDate(info.due)}</strong> — ${Math.abs(info.delta)} business day${Math.abs(info.delta) === 1 ? '' : 's'} ago. Follow up with reviewers.`
        : (isLocked
            ? `Final day of the review window (<strong>${fmtDate(info.due)}</strong>). Reviewers must return feedback today.`
            : `Reviewers have until <strong>${fmtDate(info.due)}</strong>${info.delta > 0 ? ` (${info.delta} business day${info.delta === 1 ? '' : 's'} left)` : ''}.`));
  const headlineIcon = isLocked ? '🔒' : '👁️';
  return `
    <div class="review-countdown ${cdCls}">
      <div class="rc-glass">
        <div class="review-calendar rc-md ${calCls}">
          <div class="rcal-page">
            <div class="rcal-month">${month || 'TBD'}</div>
            <div class="rcal-day">${day}</div>
            <div class="rcal-dow">${dow || '—'}</div>
            <div class="rcal-chip">${chipText}</div>
          </div>
          <div class="rcal-curl"></div>
          <div class="rcal-tear"></div>
        </div>
      </div>
      <div class="rc-body">
        <div class="rc-headline"><span class="rc-eye">${headlineIcon}</span>${headline}${info.override ? '<span class="rc-override">custom date</span>' : ''}</div>
        <div class="rc-detail">${detail}</div>
        <div class="rc-actions">
          <button class="rc-mark-complete" onclick="event.stopPropagation(); markReviewComplete('${m.id}')">✔ Mark Review Complete</button>
        </div>
      </div>
    </div>
  `;
}

// ===== AGENDA =====
let agendaActiveDay = 3;
const ANCHOR_META = {
  morningReview: {icon: '☕', title: 'Morning Review', label: 'Kickoff'},
  midMorningBreak: {icon: '☕', title: 'Morning Break', label: 'Break'},
  lunch: {icon: '🥗', title: 'Lunch Break', label: 'Lunch', cls: 'lunch'},
  afternoonBreak: {icon: '☕', title: 'Afternoon Break', label: 'Break'},
  eod: {icon: '📋', title: 'End of Day Review', label: 'Wrap'},
  otj: {icon: '💼', title: 'OTJ Practice / Buffer', label: 'OTJ Time', cls: 'otj'}
};
const ANCHOR_IDS = ['morningReview', 'midMorningBreak', 'lunch', 'afternoonBreak', 'eod', 'otj'];

function getAgendaAnchors() {
  return Object.assign({
    morningReview: 15,
    midMorningBreak: 15,
    lunch: 60,
    afternoonBreak: 15,
    eod: 15,
    otj: 60
  }, overlays.agenda.anchors || {});
}
function saveAgendaAnchors(a) {
  overlays.agenda.anchors = a;
  saveOverlays();
}
function updateAnchor(key, val) {
  const a = getAgendaAnchors();
  a[key] = Math.max(0, parseInt(val) || 0);
  saveAgendaAnchors(a);
  renderAgenda();
}
function resetAgendaAnchors() {
  delete overlays.agenda.anchors;
  saveOverlays();
  renderAgenda();
}
function sizeClass(mins) {
  if (mins <= 20) return 'size-s';
  if (mins <= 45) return 'size-m';
  return 'size-l';
}
function sizeLabel(mins) { return mins + 'm'; }

function buildDayBlocks(day) {
  const anchors = getAgendaAnchors();
  const dayMods = orderedForDay(day);
  const modBlocks = dayMods.map(m => ({
    kind: 'mod',
    id: m.id,
    title: m.n,
    mins: m.m,
    m: m
  }));
  const blocks = [];
  blocks.push({kind:'anchor', key:'morningReview', title: ANCHOR_META.morningReview.title, mins: anchors.morningReview});
  const morningQuota = 90;
  let morningMins = 0;
  let idx = 0;
  while (idx < modBlocks.length && morningMins + modBlocks[idx].mins <= morningQuota) {
    blocks.push(modBlocks[idx]); morningMins += modBlocks[idx].mins; idx++;
  }
  blocks.push({kind:'anchor', key:'midMorningBreak', title: ANCHOR_META.midMorningBreak.title, mins: anchors.midMorningBreak});
  const beforeLunch = 90;
  let cur = 0;
  while (idx < modBlocks.length && cur + modBlocks[idx].mins <= beforeLunch) {
    blocks.push(modBlocks[idx]); cur += modBlocks[idx].mins; idx++;
  }
  blocks.push({kind:'anchor', key:'lunch', title: ANCHOR_META.lunch.title, mins: anchors.lunch});
  const afternoonPart1 = 120;
  cur = 0;
  while (idx < modBlocks.length && cur + modBlocks[idx].mins <= afternoonPart1) {
    blocks.push(modBlocks[idx]); cur += modBlocks[idx].mins; idx++;
  }
  blocks.push({kind:'anchor', key:'afternoonBreak', title: ANCHOR_META.afternoonBreak.title, mins: anchors.afternoonBreak});
  while (idx < modBlocks.length) { blocks.push(modBlocks[idx]); idx++; }
  if (anchors.otj > 0) blocks.push({kind:'anchor', key:'otj', title: ANCHOR_META.otj.title, mins: anchors.otj});
  blocks.push({kind:'anchor', key:'eod', title: ANCHOR_META.eod.title, mins: anchors.eod});
  return blocks;
}

function selectAgendaDay(d) { agendaActiveDay = d; renderAgenda(); }

function updateModuleDay(id, newDay) {
  const target = Math.max(3, Math.min(10, parseInt(newDay) || 3));
  const m = modules.find(x => x.id === id);
  if (!m || m.d === target) return;
  overlays.edits[id] = overlays.edits[id] || {};
  overlays.edits[id].d = target;
  saveOverlays();
  rebuildModules();
  renderAgenda();
  showToast(`Moved to Day ${target}`);
}

function renderAgenda() {
  const anchors = getAgendaAnchors();
  const days = [3,4,5,6,7,8,9,10];
  const dayTabsHtml = days.map(d => {
    const count = modules.filter(m => m.d === d).length;
    return `<button class="agenda-day-tab ${d === agendaActiveDay ? 'active' : ''}" onclick="selectAgendaDay(${d})">Day ${d}<span class="adt-count">${count}</span></button>`;
  }).join('');
  const blocks = buildDayBlocks(agendaActiveDay);
  const modMins = blocks.filter(b => b.kind === 'mod').reduce((s, b) => s + b.mins, 0);
  const anchorMins = blocks.filter(b => b.kind === 'anchor').reduce((s, b) => s + b.mins, 0);
  const totalMins = modMins + anchorMins;
  const modCount = blocks.filter(b => b.kind === 'mod').length;
  let order = 0;
  const blocksHtml = blocks.length === 0 ? `<div class="agenda-empty">No content or anchors for Day ${agendaActiveDay} yet.</div>` : blocks.map(b => {
    if (b.kind === 'anchor') {
      const meta = ANCHOR_META[b.key];
      return `<div class="agenda-block anchor ${meta.cls || ''}"><div class="ab-size-badge">${meta.icon}</div><div class="ab-body"><div class="ab-title">${meta.title}</div><div class="ab-mins">${b.mins}m</div></div><div class="ab-controls"><span class="ab-order">${meta.label}</span></div></div>`;
    }
    order++;
    const sz = sizeClass(b.mins);
    return `
      <div class="agenda-block mod ${sz}" draggable="true" data-id="${b.id}" ondragstart="dragSrcId='${b.id}'; this.classList.add('dragging'); event.dataTransfer.effectAllowed='move';" ondragend="this.classList.remove('dragging');" ondragover="event.preventDefault(); this.classList.add('drag-over');" ondragleave="this.classList.remove('drag-over');" ondrop="commitReorder(event, '${b.id}', ${b.m.d});">
        <div class="ab-size-badge">${sizeLabel(b.mins)}</div>
        <div class="ab-body">
          <div class="ab-title">${esc(b.title)}</div>
          <span class="ab-mins">${b.mins}m</span>
        </div>
        <div class="ab-controls">
          <span class="ab-order">#${order}</span>
          <label class="ab-day-label">Day</label>
          <input type="number" class="ab-day-input" min="3" max="10" value="${b.m.d}" onchange="updateModuleDay('${b.id}', this.value)" title="Move to a different day">
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('agendaContent').innerHTML = `
    <div class="agenda-header">
      <div>
        <div class="section-eyebrow">Daily Blocking</div>
        <div class="section-title" style="margin-bottom:0;">Agenda Builder</div>
      </div>
    </div>
    <details class="agenda-anchors" open>
      <summary><span>Agenda Anchors <span style="font-weight:400;color:var(--navy-mid);font-size:12px;">· defaults for every day</span></span></summary>
      <div class="sub">Set the minutes for recurring anchor blocks that appear on every training day.</div>
      <div class="agenda-anchors-grid">
        ${ANCHOR_IDS.map(k => {
          const meta = ANCHOR_META[k];
          return `<div class="aa-row"><label>${meta.icon} ${meta.title}</label><input type="number" min="0" step="5" value="${anchors[k]}" onchange="updateAnchor('${k}', this.value)"></div>`;
        }).join('')}
      </div>
      <div style="margin-top:14px;display:flex;justify-content:flex-end;"><button class="btn" onclick="resetAgendaAnchors()">Reset to defaults</button></div>
    </details>
    <div class="agenda-day-tabs">${dayTabsHtml}</div>
    <div class="agenda-schedule">
      <div class="agenda-schedule-header">
        <h3>Day ${agendaActiveDay} · Blocking</h3>
        <div class="agenda-schedule-summary">
          <span><strong>${modCount}</strong> modules</span>
          <span><strong>${modMins}m</strong> teaching</span>
          <span><strong>${anchorMins}m</strong> anchors</span>
          <span><strong>${totalMins}m</strong> total</span>
        </div>
      </div>
      <div class="agenda-schedule-list">${blocksHtml}</div>
    </div>
  `;
}

// ===== DRAG & DROP =====
let dragSrcId = null;
function commitReorder(e, targetId, day) {
  e.preventDefault();
  const target = e.currentTarget;
  target.classList.remove('drag-over');
  if (!dragSrcId || dragSrcId === targetId) return;
  const dayMods = orderedForDay(day);
  const srcMod = modules.find(x => x.id === dragSrcId);
  if (!srcMod) return;
  if (srcMod.d !== day) {
    overlays.edits[dragSrcId] = overlays.edits[dragSrcId] || {};
    overlays.edits[dragSrcId].d = day;
    saveOverlays();
    rebuildModules();
  }
  const ids = orderedForDay(day).map(m => m.id).filter(id => id !== dragSrcId);
  const targetIdx = ids.indexOf(targetId);
  if (targetIdx === -1) return;
  ids.splice(targetIdx, 0, dragSrcId);
  overlays.order[day] = ids;
  saveOverlays();
  rebuildModules();
  const activeTab = document.querySelector('.tab.active').dataset.view;
  showView(activeTab);
  dragSrcId = null;
}

// ===== MODAL =====
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Content';
  document.getElementById('modalSub').textContent = 'Add a new module to the program.';
  document.getElementById('modalDeleteBtn').style.display = 'none';
  document.getElementById('f-name').value = '';
  document.getElementById('f-day').value = '3';
  document.getElementById('f-mins').value = '30';
  document.getElementById('f-ct').value = 'ILT';
  document.getElementById('f-stage').value = '';
  document.getElementById('f-status').value = 'ns';
  document.getElementById('f-dstart').value = '';
  document.getElementById('f-dend').value = '';
  document.getElementById('f-revclose').value = '';
  document.getElementById('f-link').value = '';
  document.getElementById('f-outcome').value = '';
  document.getElementById('f-decisions').value = '';
  document.getElementById('f-systems').value = '';
  document.getElementById('f-a1').value = '';
  document.getElementById('f-a2').value = '';
  document.getElementById('f-a3').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('modalBackdrop').classList.add('show');
}
function openEditModal(id) {
  const m = modules.find(x => x.id === id);
  if (!m) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Content';
  document.getElementById('modalSub').textContent = m.n;
  document.getElementById('modalDeleteBtn').style.display = m._base ? 'none' : 'inline-block';
  document.getElementById('f-name').value = m.n || '';
  document.getElementById('f-day').value = m.d;
  document.getElementById('f-mins').value = m.m;
  document.getElementById('f-ct').value = m.c || 'ILT';
  document.getElementById('f-stage').value = m.stage || '';
  document.getElementById('f-status').value = getStatus(m);
  document.getElementById('f-dstart').value = m.dstart || '';
  document.getElementById('f-dend').value = m.dend || '';
  document.getElementById('f-revclose').value = m.revclose || '';
  document.getElementById('f-link').value = m.link || '';
  document.getElementById('f-outcome').value = m.o || '';
  document.getElementById('f-decisions').value = m.dec || '';
  document.getElementById('f-systems').value = m.sys || '';
  document.getElementById('f-a1').value = m.a1 || '';
  document.getElementById('f-a2').value = m.a2 || '';
  document.getElementById('f-a3').value = m.a3 || '';
  document.getElementById('f-notes').value = m.nt || '';
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('show'); }
function collectForm() {
  return {
    n: document.getElementById('f-name').value.trim(),
    d: parseInt(document.getElementById('f-day').value),
    m: parseInt(document.getElementById('f-mins').value) || 0,
    c: document.getElementById('f-ct').value,
    stage: document.getElementById('f-stage').value || '',
    st: document.getElementById('f-status').value,
    dstart: document.getElementById('f-dstart').value || '',
    dend: document.getElementById('f-dend').value || '',
    revclose: document.getElementById('f-revclose').value || '',
    link: document.getElementById('f-link').value.trim(),
    o: document.getElementById('f-outcome').value.trim(),
    dec: document.getElementById('f-decisions').value.trim(),
    sys: document.getElementById('f-systems').value.trim(),
    a1: document.getElementById('f-a1').value.trim(),
    a2: document.getElementById('f-a2').value.trim(),
    a3: document.getElementById('f-a3').value.trim(),
    nt: document.getElementById('f-notes').value.trim()
  };
}
function saveModule() {
  const data = collectForm();
  if (!data.n) { showToast('Please enter a module name'); return; }
  if (editingId) {
    const m = modules.find(x => x.id === editingId);
    if (m && m._base) {
      overlays.edits[editingId] = Object.assign({}, overlays.edits[editingId] || {}, data);
    } else {
      const idx = overlays.added.findIndex(x => x.id === editingId);
      if (idx >= 0) overlays.added[idx] = Object.assign({}, overlays.added[idx], data);
    }
    showToast('Saved');
  } else {
    const id = newId();
    overlays.added.push(Object.assign({id}, data));
    showToast('Added');
  }
  saveOverlays();
  rebuildModules();
  closeModal();
  const activeTab = document.querySelector('.tab.active').dataset.view;
  showView(activeTab);
}
function deleteModule() {
  if (!editingId) return;
  if (!confirm('Delete this module?')) return;
  const idx = overlays.added.findIndex(x => x.id === editingId);
  if (idx >= 0) overlays.added.splice(idx, 1);
  else if (!overlays.deleted.includes(editingId)) overlays.deleted.push(editingId);
  delete overlays.edits[editingId];
  delete overlays.comments[editingId];
  saveOverlays();
  rebuildModules();
  closeModal();
  const activeTab = document.querySelector('.tab.active').dataset.view;
  showView(activeTab);
  showToast('Deleted');
}

document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ===== TOAST =====
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== EXPORT =====
function exportJSON() {
  const data = { savedAt: new Date().toISOString(), overlays };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `billing-dashboard-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported');
}

(function init() {
  loadOverlays();
  rebuildModules();
  renderOverview();
})();
</script>
